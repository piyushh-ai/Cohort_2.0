<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Collectra</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- NOT LOGGED IN -->
    <div id="screen-login" class="screen hidden">
      <div class="brand">
        <div class="logo-mark">CL</div>
        <span class="logo-name">Collectra</span>
      </div>
      <p class="hint">
        Sign in to Collectra to start saving pages to your vault.
      </p>
      <button class="btn-primary" id="open-login-btn">Open Collectra →</button>
    </div>

    <!-- SAVE SCREEN -->
    <div id="screen-save" class="screen hidden">
      <div class="header">
        <div class="brand-small">
          <div class="logo-mark-sm">CL</div>
          <span class="logo-name-sm">Collectra</span>
        </div>
        <button class="logout-btn" id="logout-btn" title="Sign out">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
            <path
              fill-rule="evenodd"
              d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0v2z"
            />
            <path
              fill-rule="evenodd"
              d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3z"
            />
          </svg>
        </button>
      </div>

      <!-- Page preview -->
      <div class="page-preview">
        <div class="page-favicon" id="page-favicon">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
            <path
              d="M4.715 6.542 3.343 7.914a3 3 0 1 0 4.243 4.243l1.828-1.829A3 3 0 0 0 8.586 5.5L8 6.086a1.002 1.002 0 0 0-.154.199 2 2 0 0 1 .861 3.337L6.88 11.45a2 2 0 1 1-2.83-2.83l.793-.792a4.018 4.018 0 0 1-.128-1.287z"
            />
            <path
              d="M6.586 4.672A3 3 0 0 0 7.414 9.5l.775-.776a2 2 0 0 1-.896-3.346L9.12 3.55a2 2 0 1 1 2.83 2.83l-.793.792c.112.42.155.855.128 1.287l1.372-1.372a3 3 0 1 0-4.243-4.243L6.586 4.672z"
            />
          </svg>
        </div>
        <div class="page-info">
          <p class="page-title" id="page-title">Loading...</p>
          <p class="page-url" id="page-url">...</p>
        </div>
      </div>

      <!-- Collection selector -->
      <div class="form-group">
        <label class="form-label"
          >Collection <span class="optional">(optional)</span></label
        >
        <select id="collection-select" class="form-select">
          <option value="">No Collection</option>
        </select>
      </div>

      <!-- Error -->
      <div id="error-msg" class="error-msg hidden">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
          <path
            d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 3a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 8 4zm0 8a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"
          />
        </svg>
        <span id="error-text"></span>
      </div>

      <!-- Save button -->
      <button class="btn-primary" id="save-btn">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
          <path
            d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2z"
          />
        </svg>
        Save to Vault
      </button>
    </div>

    <!-- SUCCESS SCREEN -->
    <div id="screen-success" class="screen hidden">
      <div class="success-icon">
        <svg width="28" height="28" viewBox="0 0 16 16" fill="currentColor">
          <path
            d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"
          />
        </svg>
      </div>
      <p class="success-title">Saved to vault!</p>
      <p class="success-sub" id="success-collection-name"></p>
      <button class="btn-ghost" id="view-vault-btn">View in Collectra →</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
