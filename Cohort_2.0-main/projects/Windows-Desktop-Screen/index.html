<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Windows Desktop Screen</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div class="apps">
        <div class="app">
          <img src="./images/icons8-recycle-bin-48.png" alt="" />
          <h1>Recycle Bin</h1>
        </div>
        <div class="app">
          <img src="./images/visual-studio-code-icon.png" alt="" />
          <h1>
            Visual Studio <br />
            Code
          </h1>
        </div>
        <div class="app">
          <img src="./images/Google_Chrome_icon_(2011).png" alt="" />
          <h1>Chrome</h1>
        </div>
      </div>
      <div class="taskbar">
        <div class="weather">
          <div class="icon">
            <img src="./images/weather-app-img/images/clouds.png" />
          </div>
          <div class="text">
            <h1>25&deg;C</h1>
            <h1>Clear</h1>
          </div>
        </div>
        <div class="centre">
          <div class="app-icon" id="window">
            <img class="window" src="./images/windows-color-icon.png" alt="" />
          </div>
          <div class="search-bar">
            <i class="ri-search-line"></i>
            <input type="text" placeholder="search" />
          </div>
          <div class="app-icon">
            <img src="./images/copilot-icon.png" alt="" />
          </div>
          <div class="app-icon">
            <img src="./images/windows-explorer.png" alt="" />
          </div>
          <div class="app-icon">
            <img src="./images/icons8-microsoft-edge-48 (1).png" alt="" />
          </div>
          <div class="app-icon">
            <img src="./images/microsoft-store-icon.png" alt="" />
          </div>
          <div class="app-icon">
            <img src="./images/microsoft-outlook-icon.png" alt="" />
          </div>
        </div>
        <div class="right">
          <div class="arrow">
            <i class="ri-arrow-up-s-line"></i>
          </div>
          <div class="wifi">
            <i class="ri-wifi-line"></i>
            <i class="ri-volume-up-line"></i>
          </div>
          <div class="date-time">
            <p>23:17</p>
            <p>10-12-2025</p>
          </div>
        </div>
      </div>
      <div class="right-click">
        <div class="paste">
          <div class="hover">
            <img src="./images/view.png" />
            <p>View</p>
          </div>
          <div class="hover">
            <img src="./images/sort.png" />
            <p>Sort by</p>
          </div>
          <div class="hover">
            <img
              style="height: 27px; padding: 3px 5px 0 3px"
              src="./images/refresh.png"
            />
            <p>Refresh</p>
          </div>
        </div>
        <div class="paste">
          <div class="new hover">
            <img src="./images/new.png" />
            <p>New</p>
          </div>
        </div>
        <div class="paste">
          <div class="display hover">
            <img src="./images/display.png" />
            <p>Display Settings</p>
          </div>
          <div class="display hover">
            <img src="./images/personilesed.png" />
            <p>Personalize</p>
          </div>
        </div>
        <div class="paste" style="border-bottom: none">
          <div class="display hover">
            <img src="./images/options.png" />
            <p>Show more options</p>
          </div>
        </div>
      </div>
      <div class="window-div">
        <div class="search-bar">
          <i class="ri-search-line"></i>
          <input type="text" placeholder="Search for apps, settings, and documents" />
        </div>
        <div class="window-apps">
          <div class="label">
            <h4>Pinned</h4>
            <div>
              <h5>All</h5>
              <i class="ri-arrow-right-s-line"></i>
            </div>
          </div>
          <div class="apps-window">
             <div class="app-window">
          <img src="./images/microsoft-outlook-icon.png" alt="" />
          <h1>
            Outlook
          </h1>
          </div>
          <div class="app-window">
          <img src="./images/Google_Chrome_icon_(2011).png" alt="" />
          <h1>Chrome</h1>
        </div>
        <div class="app-window">
          <img src="./images/icons8-recycle-bin-48.png" alt="" />
          <h1>Recycle Bin</h1>
        </div>
        <div class="app-window">
          <img src="./images/copilot-icon.png" alt="" />
          <h1>Copilot</h1>
        </div>
        <div class="app-window">
          <img src="./images/icons8-microsoft-edge-48 (1).png" alt="" />
          <h1>Edge</h1>
        </div>
        <div class="app-window">
          <img src="./images/windows-explorer.png" alt="" />
          <h1>Files</h1>
        </div>
        <div class="app-window">
          <img src="./images/microsoft-store-icon.png" alt="" />
          <h1>Store</h1>
        </div>
        </div>
      </div>
      <div class="window-apps">
          <div class="label">
            <h4>Recommended</h4>
            <div>
              <h5>More</h5>
              <i class="ri-arrow-right-s-line"></i>
            </div>
          </div>
          <div class="recommend">
            <div class="vscode">
              <img src="./images/visual-studio-code-icon.png" alt="">
              <div class="text">
                <p>Visual Studio Code</p>
                <p>Recently added</p>

              </div>
            </div>
          </div>
      </div>
      <div class="shutdown">
        <div class="profile">
          <img src="./images/profile.png" alt="">
          <p>Piyush Sirolia</p>
        </div>
        <div class="off">
          <img src="./images/off.png" alt="">
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
