<!DOCTYPE html>
<html lang="en">
  <head>

    <title>Todo</title>
    <link rel="stylesheet" href="style.css" />
  </head>

    <main>
        <h1>Minimal Todo App</h1>

    </main>
    <script src="script.js"></script>
  </body>
</html>
